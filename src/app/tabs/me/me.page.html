<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>My Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="profile">
  <!-- Avatar Header Block -->
  <div class="profile-header-card">
    <div class="avatar-container">
      <img [src]="profile.img" [alt]="profile.name" />
    </div>
    <h2 class="profile-name">{{ profile.name }}</h2>
    <p class="profile-username">{{ profile.uName }}</p>
  </div>

  <!-- Detailed Metadata Content Fields -->
  <ion-list lines="inset" class="profile-details-list">
    <ion-list-header>
      <ion-label>Personal Information</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-icon name="mail-outline" slot="start"></ion-icon>
      <ion-label>
        <h3>Email Address</h3>
        <p>{{ profile.email }}</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="location-outline" slot="start"></ion-icon>
      <ion-label>
        <h3>Mailing Address</h3>
        <p class="ion-text-wrap">{{ profile.address }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
